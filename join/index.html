<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>加入善念共修</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f2e9;color:#342c24;margin:0;padding:48px 20px}
    main{max-width:560px;margin:auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 12px 36px #5b463222}
    h1{margin-top:0}.button{display:block;text-align:center;background:#8b5e3c;color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:700;margin:20px 0}
    code{font-size:22px;letter-spacing:2px}.muted{color:#756a60;line-height:1.7}
  </style>
</head>
<body><main>
  <h1>加入善念共修</h1>
  <p>邀请码：<code id="code">--------</code></p>
  <a class="button" id="open" href="shannian://group">打开善念 App</a>
  <p class="muted">如果没有自动打开，请先安装善念，再点击上方按钮。<br>
  Android 用户也可以<a href="../">下载最新 APK</a>。</p>
</main><script>
  const value = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
  const code = /^[A-Z2-9]{8}$/.test(value) ? value : '';
  document.getElementById('code').textContent = code || '无效邀请码';
  document.getElementById('open').href = 'shannian://group?code=' + encodeURIComponent(code);
</script></body></html>
