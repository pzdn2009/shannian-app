<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shannian interface preview: daily practice, chanting, scriptures, meditation and nearby places.">
  <title>Shannian · Interface Preview</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; --ink:#28231e; --muted:#6c6258; --accent:#c86108; --bg:#f6f3ee; --card:#fff; }
    * { box-sizing: border-box; }
    body { margin:0; padding:0 24px 64px; background:var(--bg); color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:1120px; margin:0 auto; }
    .language-switch { display:flex; justify-content:flex-end; gap:8px; padding-top:30px; }
    .language-switch a { padding:6px 12px; border:1px solid #eadfd4; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:650; }
    .language-switch .active { border-color:var(--accent); color:#fff; background:var(--accent); }
    header { padding:34px 0 8px; }
    .back { display:inline-block; margin-bottom:20px; color:var(--muted); font-size:15px; text-decoration:none; }
    h1 { margin:0; font-size:40px; letter-spacing:-.01em; }
    .sub { margin:8px 0 0; color:var(--muted); }
    .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:26px; margin:40px 0 0; padding:0; }
    figure { margin:0; padding:14px 14px 6px; background:var(--card); border-radius:28px; box-shadow:0 10px 35px #51433312; }
    .shot { display:block; width:100%; padding:0; border:0; border-radius:20px; background:none; cursor:zoom-in; overflow:hidden; }
    .shot img { display:block; width:100%; height:auto; border-radius:20px; }
    .shot:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    figcaption { display:flex; align-items:baseline; gap:10px; padding:14px 6px 8px; font-size:15px; font-weight:600; }
    .num { color:var(--accent); font-size:13px; letter-spacing:.08em; font-variant-numeric:tabular-nums; }
    .desc { color:var(--muted); font-size:14px; font-weight:400; }
    footer { margin-top:56px; padding-top:24px; border-top:1px solid #28231e14; color:var(--muted); font-size:14px; }
    footer a { color:var(--accent); }
    dialog { padding:0; border:0; background:transparent; max-width:94vw; max-height:92vh; }
    dialog::backdrop { background:#181411d1; backdrop-filter:blur(4px); }
    dialog img { display:block; max-width:94vw; max-height:92vh; width:auto; border-radius:18px; }
    @media (max-width:560px) { body{padding:0 16px 48px} h1{font-size:30px} .gallery{grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px} figure{padding:8px 8px 2px;border-radius:20px} figcaption{padding:10px 2px 6px;font-size:13px;flex-direction:column;gap:2px}.desc{display:none} }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="language-switch" aria-label="Language"><a href="screenshots.html" lang="zh-Hans">中文</a><a class="active" href="screenshots-en.html" lang="en" aria-current="page">English</a></nav>
    <header><a class="back" href="index-en.html">← Home</a><h1>Interface Preview</h1><p class="sub">Shannian 1.1.3 · 6.1–6.3-inch iPhone · fresh installation</p></header>
    <main class="gallery">
      <figure><button class="shot" type="button" aria-label="Enlarge the home screen"><img src="screenshots/v1.1.3/01-home.png" alt="Shannian home screen with lunar date, practice plan and dedication entry" loading="lazy"></button><figcaption><span class="num">01</span>Home<span class="desc">Daily practice overview</span></figcaption></figure>
      <figure><button class="shot" type="button" aria-label="Enlarge the practice plan screen"><img src="screenshots/v1.1.3/02-plan.png" alt="Practice plan setup with primary items and quantities" loading="lazy"></button><figcaption><span class="num">02</span>Practice Plan<span class="desc">Primary practice and cycle</span></figcaption></figure>
      <figure><button class="shot" type="button" aria-label="Enlarge the chant counter"><img src="screenshots/v1.1.3/03-chanting.png" alt="Chant counter showing the current count and controls" loading="lazy"></button><figcaption><span class="num">03</span>Chant Counter<span class="desc">One-handed counting</span></figcaption></figure>
      <figure><button class="shot" type="button" aria-label="Enlarge the scripture library"><img src="screenshots/v1.1.3/04-library.png" alt="Scripture library containing Kṣitigarbha Sutra and Śūraṅgama Mantra" loading="lazy"></button><figcaption><span class="num">04</span>Scripture Library<span class="desc">Offline reading and memorization</span></figcaption></figure>
      <figure><button class="shot" type="button" aria-label="Enlarge the meditation screen"><img src="screenshots/v1.1.3/05-meditation.png" alt="Meditation timer screen" loading="lazy"></button><figcaption><span class="num">05</span>Meditation<span class="desc">Timed sitting practice</span></figcaption></figure>
      <figure><button class="shot" type="button" aria-label="Enlarge the nearby places screen"><img src="screenshots/v1.1.3/06-nearby.png" alt="Nearby vegetarian and temple dining search" loading="lazy"></button><figcaption><span class="num">06</span>Nearby Places<span class="desc">Vegetarian food and temples</span></figcaption></figure>
    </main>
    <footer><p>Screenshots are from a fresh iOS 1.1.3 installation. Android uses the same interface; some Android pages do not load online map tiles.</p><p><a href="index-en.html">Home</a> · <a href="support-en.html">Support</a> · <a href="privacy-en.html">Privacy</a></p></footer>
  </div>
  <dialog id="lightbox"><img id="lightbox-image" alt=""></dialog>
  <script>
    (function(){var dialog=document.getElementById('lightbox');var image=document.getElementById('lightbox-image');document.querySelectorAll('.shot').forEach(function(button){button.addEventListener('click',function(){var source=button.querySelector('img');image.src=source.currentSrc||source.src;image.alt=source.alt;if(typeof dialog.showModal==='function'){dialog.showModal()}else{window.open(image.src,'_blank')}})});dialog.addEventListener('click',function(event){if(event.target===dialog)dialog.close()})})();
  </script>
</body>
</html>
