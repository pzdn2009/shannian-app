<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="善念 App 界面预览：功课、念佛计数、经咒书库、禅观与附近道场。">
  <title>善念 · 界面预览</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      --ink: #28231e;
      --muted: #6c6258;
      --accent: #c86108;
      --bg: #f6f3ee;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 24px 64px;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1120px; margin: 0 auto; }
    .language-switch { display: flex; justify-content: flex-end; gap: 8px; padding-top: 30px; }
    .language-switch a { padding: 6px 12px; border: 1px solid #eadfd4; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 650; }
    .language-switch .active { border-color: var(--accent); color: #fff; background: var(--accent); }
    header { padding: 56px 0 8px; }
    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 15px;
      text-decoration: none;
    }
    .back:hover { color: var(--accent); }
    h1 { margin: 0; font-size: 40px; letter-spacing: -0.01em; }
    .sub { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 26px;
      margin: 40px 0 0;
      padding: 0;
    }
    figure {
      margin: 0;
      padding: 14px 14px 6px;
      background: var(--card);
      border-radius: 28px;
      box-shadow: 0 10px 35px #51433312;
    }
    .shot {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 20px;
      background: none;
      cursor: zoom-in;
      overflow: hidden;
    }
    .shot img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
    }
    .shot:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    figcaption {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 14px 6px 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .num {
      color: var(--accent);
      font-size: 13px;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }
    .desc { color: var(--muted); font-size: 14px; font-weight: 400; }
    footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid #28231e14;
      color: var(--muted);
      font-size: 14px;
    }
    footer a { color: var(--accent); }
    dialog {
      padding: 0;
      border: 0;
      background: transparent;
      max-width: 94vw;
      max-height: 92vh;
    }
    dialog::backdrop { background: #181411d1; backdrop-filter: blur(4px); }
    dialog img {
      display: block;
      max-width: 94vw;
      max-height: 92vh;
      width: auto;
      border-radius: 18px;
    }
    @media (max-width: 560px) {
      body { padding: 0 16px 48px; }
      header { padding-top: 36px; }
      h1 { font-size: 30px; }
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 28px; }
      figure { padding: 8px 8px 2px; border-radius: 20px; }
      figcaption { padding: 10px 2px 6px; font-size: 13px; flex-direction: column; gap: 2px; }
      .desc { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="language-switch" aria-label="语言切换">
      <a class="active" href="screenshots.html" lang="zh-Hans" aria-current="page">中文</a>
      <a href="screenshots-en.html" lang="en">English</a>
    </nav>
    <header>
      <a class="back" href="index.html">← 返回首页</a>
      <h1>界面预览</h1>
      <p class="sub">善念 1.1.3 · iPhone 6.1–6.3 英寸 · 全新安装</p>
    </header>

    <main class="gallery">
      <figure>
        <button class="shot" type="button" aria-label="放大查看首页">
          <img src="screenshots/v1.1.3/01-home.png" alt="善念首页，显示农历日期、修持计划与回向入口" loading="lazy">
        </button>
        <figcaption><span class="num">01</span>首页<span class="desc">每日功课总览</span></figcaption>
      </figure>
      <figure>
        <button class="shot" type="button" aria-label="放大查看设置修持计划">
          <img src="screenshots/v1.1.3/02-plan.png" alt="设置每日修持计划，选择主修项目与数量" loading="lazy">
        </button>
        <figcaption><span class="num">02</span>设置修持计划<span class="desc">主修与周期</span></figcaption>
      </figure>
      <figure>
        <button class="shot" type="button" aria-label="放大查看念佛计数器">
          <img src="screenshots/v1.1.3/03-chanting.png" alt="念佛计数器界面，显示当前计数与操作按钮" loading="lazy">
        </button>
        <figcaption><span class="num">03</span>念佛计数器<span class="desc">单手持握计数</span></figcaption>
      </figure>
      <figure>
        <button class="shot" type="button" aria-label="放大查看经咒书库">
          <img src="screenshots/v1.1.3/04-library.png" alt="经咒书库列表，包含地藏经与楞严咒等经咒" loading="lazy">
        </button>
        <figcaption><span class="num">04</span>经咒书库<span class="desc">离线阅读与背诵</span></figcaption>
      </figure>
      <figure>
        <button class="shot" type="button" aria-label="放大查看禅观练习">
          <img src="screenshots/v1.1.3/05-meditation.png" alt="禅观练习计时界面" loading="lazy">
        </button>
        <figcaption><span class="num">05</span>禅观练习<span class="desc">静坐计时</span></figcaption>
      </figure>
      <figure>
        <button class="shot" type="button" aria-label="放大查看附近地点">
          <img src="screenshots/v1.1.3/06-nearby.png" alt="附近素食与寺院斋堂搜索界面" loading="lazy">
        </button>
        <figcaption><span class="num">06</span>附近地点<span class="desc">素食与寺院斋堂</span></figcaption>
      </figure>
    </main>

    <footer>
      <p>截图取自 iOS 1.1.3 全新安装状态。Android 版界面一致，部分页面在 Android 上不加载在线地图瓦片。</p>
      <p><a href="index.html">返回首页</a> · <a href="support.html">使用支持</a> · <a href="privacy.html">隐私政策</a></p>
    </footer>
  </div>

  <dialog id="lightbox">
    <img id="lightbox-image" alt="">
  </dialog>

  <script>
    (function () {
      var dialog = document.getElementById('lightbox');
      var image = document.getElementById('lightbox-image');

      document.querySelectorAll('.shot').forEach(function (button) {
        button.addEventListener('click', function () {
          var source = button.querySelector('img');
          image.src = source.currentSrc || source.src;
          image.alt = source.alt;
          if (typeof dialog.showModal === 'function') {
            dialog.showModal();
          } else {
            window.open(image.src, '_blank');
          }
        });
      });

      dialog.addEventListener('click', function (event) {
        if (event.target === dialog) dialog.close();
      });
    })();
  </script>
</body>
</html>
